      - name: "Prototype RAG et MCP pour les mathématiques"
        start_date: "2026"
        summary: "Prototype exploratoire en Python pour l’ingestion de documents, l’indexation persistante, la recherche documentaire et une interface MCP en lecture seule, avec conteneurisation Docker."

