name: Deploy site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build site
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          JEKYLL_ENV=production bundle exec jekyll build
      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Prepare and validate publication
        run: python3 bin/check_public_site.py _site --prepare --report site-validation.json
      - name: Save the validated site
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
          include-hidden-files: true
          retention-days: 3
      - name: Save validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-validation
          path: site-validation.json
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: site-preview
          path: _site
      - name: Publish the validated artifact
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
