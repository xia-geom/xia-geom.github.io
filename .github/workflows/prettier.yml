name: Prettier code formatter

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked formatting tools
        run: npm ci --ignore-scripts
      - name: Check formatting
        id: prettier
        run: npx prettier . --check
      - name: Prepare formatting suggestions
        if: failure() && steps.prettier.outcome == 'failure'
        run: |
          npx prettier . --write
          mkdir -p "$RUNNER_TEMP/formatting"
          git diff > "$RUNNER_TEMP/formatting/formatting.patch"
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "formatting"
          paths = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=ACM"], text=True).splitlines()
          for name in paths:
              source = pathlib.Path(name)
              destination = root / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
          PY
      - name: Upload suggestions without writing to the repository
        if: failure() && steps.prettier.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: formatting-suggestions
          path: ${{ runner.temp }}/formatting/
          include-hidden-files: true
          retention-days: 7
